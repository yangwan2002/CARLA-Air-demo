# =============================================================================
# L2 — semantically rich, geometrically challenging.
# =============================================================================
# Ablation regime per the paper plan: this is the SAGENet sweet-spot test set.
#
#   L1 (paper_eval_v2.yaml)     — geom moderate, semantics moderate (baseline)
#   L2 (this file)              — geom HARD,   semantics RICH       (sweet spot)
#   L3 (paper_eval_l3*.yaml)    — geom HARD,   semantics POOR       (limit test)
#
# What changed vs L1 (paper_eval_v2.yaml)
# ---------------------------------------
# Geometry:
#   - UAV altitude 35 m -> 50 m  (scale ratio vs UGV grows from ~1:5 to ~1:7)
#   - UAV pitch -45° -> -55°     (closer to nadir, harder cross-view alignment)
# Scene semantics (the point of this run):
#   - Per-relay theming: each relay anchors a distinct semantic district so
#     the dataset *union* covers a wide class palette while each individual
#     image stays balanced (8-12 distinguishable classes per frame).
#         relay_01 NW   — coffee shop / bakery scene   (street furniture)
#         relay_02 N    — busy plaza (cars + cyclists + ad pillars)
#         relay_03 NE   — gas station / convenience    (kiosk + barriers)
#         relay_04 SW   — park / green corridor        (trees + benches)
#         relay_05 SE   — market / vendor stalls       (advertisement + bicycle)
#         relay_06 E    — residential parking          (parked sedans + trash)
#         relay_07 W    — construction / maintenance   (barriers + warehouse)
#   - moving_npc_vehicles 12 -> 22, npc_vehicle_filters expanded to 12 brands
#     for visual diversity.
#   - walkers 20 -> 40  (more pedestrian semantic anchors)
#
# Same ring path as L1, same 105 s duration => mIoU/center-error numbers are
# directly comparable to L1 head-to-head.
# =============================================================================

simulation:
  map: Town10HD
  carla_host: localhost
  carla_port: 2000
  synchronous_mode: true
  fixed_delta_seconds: 0.05
  simulation_hz: 20
  save_hz: 5
  duration_seconds: 105
  output_dir: /root/autodl-tmp/CARLA-Air-demo/AirGroundRelay-Sim
  sequence_name: paper_eval_l2_sem_rich
  seed: 2024
  weather:
    cloudiness: 10.0
    precipitation: 0.0
    sun_altitude_angle: 70.0

ugv:
  blueprint: vehicle.tesla.model3
  role_name: ugv_collector
  spawn_point_index: 49
  spawn_xy: null
  speed_mps: 8.0
  tm_speed_difference_pct: 45.0
  stop_radius_m: 4.0
  loop_mode: true
  reloop_cooldown_s: 8.0
  sensor_mode: rgbd
  camera:
    resolution: [1280, 720]
    fov: 90.0
    location: [1.5, 0.0, 1.6]
    rotation: [0.0, 0.0, 0.0]
    stereo_baseline_m: 0.2
    stereo_capture_depth: false

uav:
  body_blueprint: vehicle.diamondback.century
  role_name: uav_collector
  altitude_m: 50.0          # L2: +15 m vs L1 to enlarge scale gap
  spawn_altitude_m: 50.0
  min_altitude_m: 5.0
  spawn_xy: [-0.76, 24.6]
  camera_pitch_deg: -55.0   # L2: closer to nadir
  cameras:
    front_rgb: true
    front_depth: true
  camera:
    resolution: [1280, 720]
    fov: 90.0
    location: [0.0, 0.0, -0.3]

trajectory:
  uav_default_speed_mps: 6.5
  phases:
    - name: boulevard_1lap_cw
      t_start: 0.0
      t_end: 105.0
      expected_relay: null
      uav_follow_ugv: true
      uav_yaw_mode: follow_path
      uav_path:
        - [-0.76, 24.6, 50.0]
      ugv_path:
        - [20.0, 24.6]
        - [40.0, 24.6]
        - [52.0, 24.6]
        - [55.0, 22.0]
        - [54.0, 20.0]
        - [53.0, 18.0]
        - [52.0, 16.6]
        - [30.0, 16.6]
        - [10.0, 16.6]
        - [-10.0, 16.6]
        - [-30.0, 16.6]
        - [-52.0, 16.6]
        - [-55.0, 18.0]
        - [-54.0, 20.0]
        - [-53.0, 22.0]
        - [-52.0, 24.6]
        - [-30.0, 24.6]
        - [-0.76, 24.6]

# Same 7-relay layout as L1 (LOS validated). Only the per_relay dressing differs.
relay_cameras:
  default_resolution: [1280, 720]
  default_fov: 90.0
  default_use_depth: true
  cameras:
    - name: relay_01
      location: [-40.0, 40.0, 10.0]
      look_at: [-40.0, 25.5, 0.4]
      resolution: [1280, 720]
      fov: 90.0
      use_depth: true
    - name: relay_02
      location: [0.0, 36.0, 10.0]
      look_at: [0.0, 25.5, 0.4]
      resolution: [1280, 720]
      fov: 90.0
      use_depth: true
    - name: relay_03
      location: [40.0, 40.0, 10.0]
      look_at: [40.0, 25.5, 0.4]
      resolution: [1280, 720]
      fov: 90.0
      use_depth: true
    - name: relay_04
      location: [-20.0, 0.0, 10.0]
      look_at: [-20.0, 15.0, 0.4]
      resolution: [1280, 720]
      fov: 90.0
      use_depth: true
    - name: relay_05
      location: [20.0, 0.0, 10.0]
      look_at: [20.0, 15.0, 0.4]
      resolution: [1280, 720]
      fov: 90.0
      use_depth: true
    - name: relay_06
      location: [52.0, 40.0, 10.0]
      look_at:  [50.0, 20.5, 0.4]
      resolution: [1280, 720]
      fov: 90.0
      use_depth: true
    - name: relay_07
      location: [-52.0, 40.0, 10.0]
      look_at:  [-50.0, 20.5, 0.4]
      resolution: [1280, 720]
      fov: 90.0
      use_depth: true

# -----------------------------------------------------------------------------
# Themed scene dressing — every relay covers a distinct semantic district.
# Class budget per relay: 1-2 static cars + 4-6 props from non-overlapping
# categories. Props are placed on the FAR sidewalk by scene_dressing.py
# (offset = ring_radius_m + 2.5 m, spread 3 m along-street). With 5-6 props
# the lateral spread is ~15 m, well within each relay's ~35 m footprint.
# -----------------------------------------------------------------------------
scene:
  dressing:
    # 22 NPC vehicles drawn from a wide brand palette = diverse car classes
    # for the segmentation backbone to disambiguate.
    moving_npc_vehicles: 22
    npc_vehicle_filters:
      - vehicle.audi.*
      - vehicle.tesla.*
      - vehicle.mercedes.*
      - vehicle.nissan.*
      - vehicle.toyota.*
      - vehicle.mini.*
      - vehicle.bmw.*
      - vehicle.chevrolet.*
      - vehicle.dodge.*
      - vehicle.ford.*
      - vehicle.jeep.*
      - vehicle.lincoln.*
      - vehicle.seat.*
      - vehicle.volkswagen.*
      - vehicle.citroen.*
    # 40 walkers => regular pedestrian presence in nearly every relay frame.
    walkers: 40

    per_relay:
      # ------------------------------------------------------------------ #
      # relay_01 NW — café / bakery district
      # categories: kiosk, bench, trashcan, tree, signage, bicycle, sedan
      # ------------------------------------------------------------------ #
      relay_01:
        ring_radius_m: 6.0
        static_vehicles: 2
        static_vehicle_blueprints:
          - vehicle.toyota.prius
          - vehicle.audi.a2
        props:
          - {blueprint: static.prop.kiosk_01, count: 1}
          - {blueprint: static.prop.bench01, count: 1}
          - {blueprint: static.prop.trashcan02, count: 1}
          - {blueprint: static.prop.aporosatree, count: 1}
          - {blueprint: static.prop.advertisement, count: 1}
          - {blueprint: vehicle.diamondback.century, count: 1}

      # ------------------------------------------------------------------ #
      # relay_02 N — busy plaza
      # categories: ad pillar, cypress tree, scooter, bicycle, bench, sport car
      # ------------------------------------------------------------------ #
      relay_02:
        ring_radius_m: 6.0
        static_vehicles: 2
        static_vehicle_blueprints:
          - vehicle.audi.tt
          - vehicle.mercedes.coupe
        props:
          - {blueprint: static.prop.advertisement, count: 1}
          - {blueprint: static.prop.cypresstree, count: 1}
          - {blueprint: vehicle.vespa.zx125, count: 1}
          - {blueprint: vehicle.gazelle.omafiets, count: 1}
          - {blueprint: static.prop.bench01, count: 1}
          - {blueprint: static.prop.trashcan04, count: 1}

      # ------------------------------------------------------------------ #
      # relay_03 NE — gas station / convenience
      # categories: kiosk, barrier, signage, trashcan, tree, taxi-style sedan
      # ------------------------------------------------------------------ #
      relay_03:
        ring_radius_m: 6.0
        static_vehicles: 2
        static_vehicle_blueprints:
          - vehicle.chevrolet.impala
          - vehicle.bmw.grandtourer
        props:
          - {blueprint: static.prop.kiosk_01, count: 1}
          - {blueprint: static.prop.streetbarrier, count: 2}
          - {blueprint: static.prop.advertisement, count: 1}
          - {blueprint: static.prop.trashcan03, count: 1}
          - {blueprint: static.prop.aporosatree, count: 1}

      # ------------------------------------------------------------------ #
      # relay_04 SW — park / green corridor (semantic emphasis: vegetation)
      # categories: 2x trees, 2x benches, trashcan, bicycle
      # ------------------------------------------------------------------ #
      relay_04:
        ring_radius_m: 7.0
        static_vehicles: 1
        static_vehicle_blueprints:
          - vehicle.tesla.model3
        props:
          - {blueprint: static.prop.cypresstree, count: 1}
          - {blueprint: static.prop.aporosatree, count: 1}
          - {blueprint: static.prop.bench01, count: 1}
          - {blueprint: static.prop.bench02, count: 1}
          - {blueprint: static.prop.trashcan01, count: 1}
          - {blueprint: vehicle.diamondback.century, count: 1}

      # ------------------------------------------------------------------ #
      # relay_05 SE — open-air market / vendor row
      # categories: ads + scooter + tree + barrier + bicycle + suv
      # ------------------------------------------------------------------ #
      relay_05:
        ring_radius_m: 6.0
        static_vehicles: 2
        static_vehicle_blueprints:
          - vehicle.seat.leon
          - vehicle.lincoln.mkz_2017
        props:
          - {blueprint: static.prop.advertisement, count: 2}
          - {blueprint: vehicle.vespa.zx125, count: 1}
          - {blueprint: static.prop.cypresstree, count: 1}
          - {blueprint: static.prop.streetbarrier, count: 1}
          - {blueprint: vehicle.gazelle.omafiets, count: 1}

      # ------------------------------------------------------------------ #
      # relay_06 E — residential parking lane
      # categories: 3 parked sedans + trashcan + bench + tree
      # (heavier vehicle theme — tests how matching handles repeated cars)
      # ------------------------------------------------------------------ #
      relay_06:
        ring_radius_m: 6.0
        static_vehicles: 3
        static_vehicle_blueprints:
          - vehicle.jeep.wrangler_rubicon
          - vehicle.ford.mustang
          - vehicle.dodge.charger_police
        props:
          - {blueprint: static.prop.trashcan01, count: 1}
          - {blueprint: static.prop.bench01, count: 1}
          - {blueprint: static.prop.aporosatree, count: 1}
          - {blueprint: static.prop.advertisement, count: 1}

      # ------------------------------------------------------------------ #
      # relay_07 W — construction / maintenance
      # categories: barriers (heavy), kiosk, trashcan, bicycle, light sedan
      # ------------------------------------------------------------------ #
      relay_07:
        ring_radius_m: 6.0
        static_vehicles: 1
        static_vehicle_blueprints:
          - vehicle.volkswagen.t2
        props:
          - {blueprint: static.prop.streetbarrier, count: 3}
          - {blueprint: static.prop.kiosk_01, count: 1}
          - {blueprint: static.prop.trashcan04, count: 1}
          - {blueprint: vehicle.gazelle.omafiets, count: 1}

      default:
        static_vehicles: 0
        props: []

save:
  image_format: png
  save_depth_npy: false
  save_depth_png: false
  depth_png_max_m: 80.0
  save_frames_jsonl: true
  save_pose_csv: true
  save_calibration: true
  save_trajectory_yaml: true
  jsonl_filename: frames.jsonl
