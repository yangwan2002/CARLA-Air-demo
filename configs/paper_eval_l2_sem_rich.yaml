# =============================================================================
# L2 — geometrically harder than L1, with a *modest* semantic enrichment.
# =============================================================================
# Ablation regime per the paper plan:
#   L1 (paper_eval_v2.yaml)     — geom moderate, semantics moderate (baseline)
#   L2 (this file)              — geom HARD,   semantics RICH       (sweet spot)
#   L3 (paper_eval_l3*.yaml)    — geom HARD,   semantics POOR       (limit test)
#
# Vs L1, the semantic enrichments below still define L2, but the relay layout
# is also rebalanced so relay/UGV overlap is distributed more uniformly around
# the loop. Camera intrinsics, ring path, and the broader scene-dressing
# palette stay aligned with L1 so the head-to-head comparison remains legible:
#
#   1) Each relay adds 2-3 *parked* two-wheelers (bicycle / scooter / moto)
#      arranged in a neat rack on the relay-side sidewalk. CARLA bike
#      blueprints carry a baked-in rider mesh — that's fine, segmentation
#      models will read it as person+bicycle which are both useful classes.
#   2) Each relay adds exactly ONE small-footprint extra prop (mailbox /
#      plantpot / colacan / trafficcone / streetsign) — single, low,
#      ~0.5 m objects that enrich the class palette without re-styling
#      the scene into a "themed district".
#   3) Trees are dropped from 3 of the 7 relays to free the relay camera's
#      foreground. The remaining 4 trees stay in the prop row at the back.
#
# Geometry-side changes vs L1 (the geom-HARD half):
#   - UAV altitude 35 m (same as L1 baseline; pitch -55° for harder cross-view)
#   - UAV pitch -45° -> -55°     (closer to nadir, harder cross-view match)
#
# Same ring path as L1, same 105 s duration => mIoU / center-error numbers
# are directly comparable to L1.
#
# Bug fixes folded in here:
#   - save_hz restored to 10 so the effective dataset cadence matches the
#     older paper run.
#   - relay headings are redistributed around the full ring and biased along
#     the local UGV travel direction, so relay/UGV overlap is no longer
#     dominated by 90 deg side views.
#   - relay sites are spread across both the left/start street and the
#     right/return street with a 3-on-blue / 4-on-yellow split.
#   - bike_offset_m 4.0 -> 4.5 to leave a 0.5 m margin against the UGV's
#     stop_radius_m=4.0, so a parked bike never trips TM's safety radius.
#   - moving NPCs / walkers are kept away from the full UGV loop corridor,
#     and the UGV TM is allowed to ignore residual blockers instead of stalling.
# =============================================================================

simulation:
  map: Town10HD
  carla_host: localhost
  carla_port: 2000
  synchronous_mode: true
  fixed_delta_seconds: 0.05
  simulation_hz: 20
  save_hz: 10
  duration_seconds: 105
  output_dir: /root/autodl-tmp/CARLA-Air-demo/AirGroundRelay-Sim
  sequence_name: paper_eval_l2_sem_rich
  auto_sequence_name_timestamp: true
  sequence_name_timestamp_format: "%Y%m%d_%H%M%S"
  seed: 2024
  weather:
    cloudiness: 10.0
    precipitation: 0.0
    sun_altitude_angle: 70.0

ugv:
  blueprint: vehicle.tesla.model3
  role_name: ugv_collector
  spawn_point_index: 49
  spawn_xy: null
  speed_mps: 8.0
  tm_speed_difference_pct: 20.0
  tm_ignore_vehicles_pct: 100.0
  tm_ignore_walkers_pct: 100.0
  stop_radius_m: 4.0
  loop_mode: true
  reloop_cooldown_s: 8.0
  sensor_mode: rgbd
  camera:
    resolution: [1920, 1080]
    fov: 90.0
    location: [1.5, 0.0, 1.6]
    rotation: [0.0, 0.0, 0.0]
    stereo_baseline_m: 0.2
    stereo_capture_depth: false

uav:
  body_blueprint: vehicle.diamondback.century
  role_name: uav_collector
  altitude_m: 35.0
  spawn_altitude_m: 35.0
  min_altitude_m: 5.0
  spawn_xy: [-0.76, 24.6]
  camera_pitch_deg: -55.0   # L2: closer to nadir
  cameras:
    front_rgb: true
    front_depth: true
  camera:
    resolution: [1920, 1080]
    fov: 90.0
    location: [0.0, 0.0, -0.3]

trajectory:
  uav_default_speed_mps: 6.5
  phases:
    - name: boulevard_1lap_cw
      t_start: 0.0
      t_end: 105.0
      expected_relay: null
      uav_follow_ugv: true
      uav_yaw_mode: follow_path
      uav_path:
        - [-0.76, 24.6, 35.0]
      # IMPORTANT: this is the OUTER perimeter loop the TM actually lane-follows
      # (observed in 155623 run's pose.csv). The previous small inner-loop spec
      # caused scene_dressing._nearest_path_tangent to pick a far-away segment
      # for every relay on the outer loop, which inverted the prop-placement
      # axis and dropped kiosks / streetbarriers / advertisements INTO the
      # lane (and let npc_route_keepout silently fail). Keep this in sync with
      # the real TM trajectory.
      ugv_path:
        # leg N (y≈+24.6, UGV +x): x ∈ [-1, 95]
        - [10.0, 24.6]
        - [40.0, 24.6]
        - [70.0, 24.6]
        - [95.0, 24.6]
        # NE corner -> leg E (x≈+106, UGV -y): y ∈ [22, -35]
        - [104.0, 18.0]
        - [106.0, 0.0]
        - [106.0, -20.0]
        - [106.0, -35.0]
        # SE corner -> leg S (y≈-64, palm-tree boulevard, UGV -x): x ∈ [95, -30]
        - [100.0, -55.0]
        - [85.0, -64.0]
        - [55.0, -64.0]
        - [25.0, -64.0]
        - [-10.0, -64.0]
        - [-30.0, -64.0]
        # SW corner -> leg W (x≈-49, UGV +y): y ∈ [-57, +2]
        - [-46.0, -58.0]
        - [-49.0, -30.0]
        - [-49.0, -10.0]
        - [-49.0, 2.0]
        # NW corner -> close loop back along leg N
        - [-45.0, 22.0]
        - [-30.0, 24.6]
        - [-0.76, 24.6]

# 7 relays placed in UGV-forward-overlap configuration (2-1-3-1 split).
#
# Actual UGV trajectory observed from the 155623 run pose.csv shows the
# TM lane-follows the OUTER perimeter of one big city block, NOT the
# small back-and-forth implied by ugv_path waypoints:
#
#   leg N (north,  y≈+24.6, UGV  +x): x ∈ [-1, 95]   (t ≈  0 – 17 s)
#   leg E (east,   x≈+106,  UGV  -y): y ∈ [22, -35]  (t ≈ 18 – 28 s)
#   leg S (south,  y≈-64,   UGV  -x): x ∈ [95, -30]  (t ≈ 36 – 52 s) ★ palm-tree street
#   leg W (west,   x≈-49,   UGV  +y): y ∈ [-57, +2]  (t ≈ 54 – 105 s)
#
# Each relay is placed off-road, ~10 m above the curb, looking in the
# SAME direction the UGV moves on its leg so the relay's forward cone
# overlaps the UGV front camera's forward cone.
#
# Distribution requested by user (2-1-3-1):
#   * 2 relays on leg N
#   * 1 relay  on leg E
#   * 3 relays on leg S (palm-tree street — primary focus)
#   * 1 relay  on leg W
relay_cameras:
  default_resolution: [1920, 1080]
  default_fov: 90.0
  default_use_depth: true
  cameras:
    # ----- Leg N (y=24.6, UGV +x) — 2 relays, all looking +x
    - name: relay_01
      location: [-10.0, 30.6, 10.0]
      look_at: [25.0, 24.6, 0.4]
      resolution: [1920, 1080]
      fov: 90.0
      use_depth: true
    - name: relay_02
      location: [40.0, 30.6, 10.0]
      look_at: [75.0, 24.6, 0.4]
      resolution: [1920, 1080]
      fov: 90.0
      use_depth: true
    # ----- Leg E (x=106, UGV -y) — 1 relay, looking -y
    - name: relay_03
      location: [112.0, 20.0, 10.0]
      look_at: [106.0, -15.0, 0.4]
      resolution: [1920, 1080]
      fov: 90.0
      use_depth: true
    # ----- Leg S (y=-64, palm-tree street, UGV -x) — 3 relays, all looking -x
    # Do NOT use the same (location→look_at) offset for all three — that makes
    # three parallel copies on a repetitive boulevard look identical.  Split:
    #   relay_04  north sidewalk, street-level  (eastern segment x≈70–90)
    #   relay_05  north sidewalk, elevated      (mid segment x≈35–55)
    #   relay_06  south sidewalk, street-level  (western segment x≈0–25)
    - name: relay_04
      location: [85.0, -55.0, 10.0]
      look_at: [72.0, -64.0, 0.4]
      resolution: [1920, 1080]
      fov: 90.0
      use_depth: true
    - name: relay_05
      location: [52.0, -54.0, 13.0]
      look_at: [38.0, -64.0, 0.4]
      resolution: [1920, 1080]
      fov: 90.0
      use_depth: true
    - name: relay_06
      location: [12.0, -72.0, 10.0]
      look_at: [0.0, -64.0, 0.4]
      resolution: [1920, 1080]
      fov: 90.0
      use_depth: true
    # ----- Leg W (x=-49, UGV +y) — 1 relay, looking +y
    - name: relay_07
      location: [-55.0, -50.0, 10.0]
      look_at: [-49.0, -20.0, 0.4]
      resolution: [1920, 1080]
      fov: 90.0
      use_depth: true

# -----------------------------------------------------------------------------
# Scene dressing — same palette as L1 plus a *small* per-relay increment:
#   * 2-3 parked two-wheelers per relay (bike rack on near sidewalk)
#   * exactly ONE small extra prop per relay (mailbox / plantpot / colacan
#     / trafficcone / streetsign) — < 0.5 m, doesn't dominate the frame
#   * trees only on relays 02 / 04 / 05 / 06; 01 / 03 / 07 are tree-free
#     so the bike rack stays visible from the relay viewpoint
# Static-car palette and counts are inherited verbatim from L1.
# -----------------------------------------------------------------------------
scene:
  dressing:
    # L2 semantic target: all dynamic actors live ON the UGV outer-loop corridor
    # so every relay / UGV camera sees them from t≈0 — not map-wide spawns.
    # Safety rails (UGV stall / NPC floating):
    #   * UGV tm_ignore_vehicles/walkers = 100% — applied at spawn + controller
    #   * npc_path_center_keepout — TM cars prefer adjacent lane, not UGV lane
    #   * static_route_keepout — parked props stay off lane centerline
    #   * raycast Z + spawn cull + post-warmup cull — no floating NPCs
    moving_npc_vehicles: 24
    walkers: 40
    npc_keepout_radius_m: 18.0
    npc_route_spawn_radius_m: 18.0
    npc_route_spawn_spacing_m: 10.0
    npc_path_center_keepout_m: 3.5
    npc_route_keepout_radius_m: 0.0
    static_route_keepout_radius_m: 7.0
    walker_route_spawn_radius_m: 16.0
    walker_route_spawn_spacing_m: 8.0
    walker_route_keepout_radius_m: 0.0
    walker_target_route_spawn_radius_m: 16.0
    walker_spawn_keepout_radius_m: 18.0
    # NPC spawn: Driving-lane projection + raycast Z. Never set_transform on
    # autopilot vehicles after spawn (causes physics explosions / flying SUVs).
    npc_vehicle_lift_m: 0.35
    npc_spawn_max_z_delta_m: 0.8
    npc_spawn_max_z_err_m: 0.8
    static_vehicle_snap_margin_m: 0.02
    post_dress_warmup_ticks: 8
    npc_vehicle_filters:
      - vehicle.audi.*
      - vehicle.tesla.*
      - vehicle.mercedes.*
      - vehicle.nissan.*
      - vehicle.toyota.*
      - vehicle.mini.*
      - vehicle.bmw.*
      - vehicle.chevrolet.*
      - vehicle.dodge.*
      - vehicle.ford.*
      - vehicle.jeep.*
      - vehicle.lincoln.*
      - vehicle.seat.*
      - vehicle.volkswagen.*
      - vehicle.citroen.*
    # -----------------------------------------------------------------------
    # Per-relay dressing — L1 palette + L2 bike-rack increment + extra L2
    # small props (streetsign / plantpot / colacan / trafficcone / aporosatree)
    # so every relay carries ~9-11 semantic classes in frame.
    # ugv_path MUST stay on the outer loop; kiosk / streetbarrier still get
    # +4.5 m extra offset in scene_dressing.py (_BLOCKING_PROP_IDS).
    # ring_radius 5.5 keeps props closer to the relay FOV than 6.5/8.0.
    # -----------------------------------------------------------------------
    per_relay:
      relay_01:
        ring_radius_m: 5.5
        bike_offset_m: 4.5
        static_vehicles: 4
        static_vehicle_blueprints:
          - vehicle.toyota.prius
          - vehicle.audi.a2
          - vehicle.mini.cooper_s
        props:
          - {blueprint: static.prop.kiosk_01, count: 1}
          - {blueprint: static.prop.trashcan02, count: 2}
          - {blueprint: static.prop.streetbarrier, count: 1}
          - {blueprint: static.prop.bench01, count: 1}
          - {blueprint: static.prop.advertisement, count: 1}
          - {blueprint: static.prop.aporosatree, count: 1}
          - {blueprint: static.prop.mailbox, count: 1}
          - {blueprint: static.prop.streetsign01, count: 1}
          - {blueprint: static.prop.trafficcone01, count: 2}
          - {blueprint: vehicle.diamondback.century, count: 1}
          - {blueprint: vehicle.gazelle.omafiets, count: 2}
          - {blueprint: vehicle.vespa.zx125, count: 1}

      relay_02:
        ring_radius_m: 5.5
        bike_offset_m: 4.5
        static_vehicles: 4
        static_vehicle_blueprints:
          - vehicle.audi.tt
          - vehicle.mercedes.coupe
          - vehicle.nissan.micra
          - vehicle.mini.cooper_s
        props:
          - {blueprint: static.prop.advertisement, count: 1}
          - {blueprint: static.prop.trashcan04, count: 2}
          - {blueprint: static.prop.bench01, count: 1}
          - {blueprint: static.prop.cypresstree, count: 1}
          - {blueprint: static.prop.streetsign01, count: 1}
          - {blueprint: static.prop.plantpot01, count: 1}
          - {blueprint: static.prop.colacan, count: 1}
          - {blueprint: static.prop.trafficcone01, count: 2}
          - {blueprint: vehicle.gazelle.omafiets, count: 2}
          - {blueprint: vehicle.vespa.zx125, count: 2}
          - {blueprint: vehicle.kawasaki.ninja, count: 1}

      relay_03:
        ring_radius_m: 5.5
        bike_offset_m: 4.5
        static_vehicles: 4
        static_vehicle_blueprints:
          - vehicle.chevrolet.impala
          - vehicle.citroen.c3
          - vehicle.bmw.grandtourer
        props:
          - {blueprint: static.prop.bench02, count: 1}
          - {blueprint: static.prop.trashcan03, count: 2}
          - {blueprint: static.prop.advertisement, count: 1}
          - {blueprint: static.prop.streetbarrier, count: 1}
          - {blueprint: static.prop.aporosatree, count: 1}
          - {blueprint: static.prop.colacan, count: 1}
          - {blueprint: static.prop.streetsign01, count: 1}
