# =============================================================================
# L2 — geometrically harder than L1, with a *modest* semantic enrichment.
# =============================================================================
# Ablation regime per the paper plan:
#   L1 (paper_eval_v2.yaml)     — geom moderate, semantics moderate (baseline)
#   L2 (this file)              — geom HARD,   semantics RICH       (sweet spot)
#   L3 (paper_eval_l3*.yaml)    — geom HARD,   semantics POOR       (limit test)
#
# Vs L1, only three things change at the scene level — everything else
# (camera intrinsics, ring path, relay layout, static-car palette, kiosk /
# bench / trashcan / advertisement / streetbarrier usage) is identical so
# numbers stay comparable head-to-head:
#
#   1) Each relay adds 2-3 *parked* two-wheelers (bicycle / scooter / moto)
#      arranged in a neat rack on the relay-side sidewalk. CARLA bike
#      blueprints carry a baked-in rider mesh — that's fine, segmentation
#      models will read it as person+bicycle which are both useful classes.
#   2) Each relay adds exactly ONE small-footprint extra prop (mailbox /
#      plantpot / colacan / trafficcone / streetsign) — single, low,
#      ~0.5 m objects that enrich the class palette without re-styling
#      the scene into a "themed district".
#   3) Trees are dropped from 3 of the 7 relays to free the relay camera's
#      foreground. The remaining 4 trees stay in the prop row at the back.
#
# Geometry-side changes vs L1 (the geom-HARD half):
#   - UAV altitude 35 m -> 40 m  (UAV/UGV scale ratio ~1:5 -> ~1:5.7)
#   - UAV pitch -45° -> -55°     (closer to nadir, harder cross-view match)
#
# Same ring path as L1, same 105 s duration => mIoU / center-error numbers
# are directly comparable to L1.
#
# Bug fixes folded in here:
#   - save_hz restored to 10 so the effective dataset cadence matches the
#     older paper run.
#   - relay headings are redistributed around the full ring and biased along
#     the local UGV travel direction, so relay/UGV overlap is no longer
#     dominated by 90 deg side views.
#   - relay sites are spread across both the left/start street and the
#     right/return street instead of collapsing onto one side of the loop.
#   - bike_offset_m 4.0 -> 4.5 to leave a 0.5 m margin against the UGV's
#     stop_radius_m=4.0, so a parked bike never trips TM's safety radius.
#   - moving NPCs / walkers are kept away from the full UGV loop corridor,
#     and the UGV TM is allowed to ignore residual blockers instead of stalling.
# =============================================================================

simulation:
  map: Town10HD
  carla_host: localhost
  carla_port: 2000
  synchronous_mode: true
  fixed_delta_seconds: 0.05
  simulation_hz: 20
  save_hz: 10
  duration_seconds: 105
  output_dir: /root/autodl-tmp/CARLA-Air-demo/AirGroundRelay-Sim
  sequence_name: paper_eval_l2_sem_rich
  auto_sequence_name_timestamp: true
  sequence_name_timestamp_format: "%Y%m%d_%H%M%S"
  seed: 2024
  weather:
    cloudiness: 10.0
    precipitation: 0.0
    sun_altitude_angle: 70.0

ugv:
  blueprint: vehicle.tesla.model3
  role_name: ugv_collector
  spawn_point_index: 49
  spawn_xy: null
  speed_mps: 8.0
  tm_speed_difference_pct: 20.0
  tm_ignore_vehicles_pct: 100.0
  tm_ignore_walkers_pct: 100.0
  stop_radius_m: 4.0
  loop_mode: true
  reloop_cooldown_s: 8.0
  sensor_mode: rgbd
  camera:
    resolution: [1920, 1080]
    fov: 90.0
    location: [1.5, 0.0, 1.6]
    rotation: [0.0, 0.0, 0.0]
    stereo_baseline_m: 0.2
    stereo_capture_depth: false

uav:
  body_blueprint: vehicle.diamondback.century
  role_name: uav_collector
  altitude_m: 40.0          # L2: +5 m vs L1 (35 m)
  spawn_altitude_m: 40.0
  min_altitude_m: 5.0
  spawn_xy: [-0.76, 24.6]
  camera_pitch_deg: -55.0   # L2: closer to nadir
  cameras:
    front_rgb: true
    front_depth: true
  camera:
    resolution: [1920, 1080]
    fov: 90.0
    location: [0.0, 0.0, -0.3]

trajectory:
  uav_default_speed_mps: 6.5
  phases:
    - name: boulevard_1lap_cw
      t_start: 0.0
      t_end: 105.0
      expected_relay: null
      uav_follow_ugv: true
      uav_yaw_mode: follow_path
      uav_path:
        - [-0.76, 24.6, 40.0]
      ugv_path:
        - [20.0, 24.6]
        - [40.0, 24.6]
        - [52.0, 24.6]
        - [55.0, 22.0]
        - [54.0, 20.0]
        - [53.0, 18.0]
        - [52.0, 16.6]
        - [30.0, 16.6]
        - [10.0, 16.6]
        - [-10.0, 16.6]
        - [-30.0, 16.6]
        - [-52.0, 16.6]
        - [-55.0, 18.0]
        - [-54.0, 20.0]
        - [-53.0, 22.0]
        - [-52.0, 24.6]
        - [-30.0, 24.6]
        - [-0.76, 24.6]

# 7 relays distributed around the full UGV loop:
#   * start / forward street: relay_01, relay_02, relay_03, relay_04
#   * return / opposite-direction street after the turn: relay_05, relay_06,
#     relay_07
#   * no relay is placed on the turn sectors
relay_cameras:
  default_resolution: [1920, 1080]
  default_fov: 90.0
  default_use_depth: true
  cameras:
    - name: relay_01
      location: [-48.0, 24.6, 10.0]
      look_at: [-32.0, 24.6, 0.4]
      resolution: [1920, 1080]
      fov: 90.0
      use_depth: true
    - name: relay_02
      location: [-16.0, 24.6, 10.0]
      look_at: [0.0, 24.6, 0.4]
      resolution: [1920, 1080]
      fov: 90.0
      use_depth: true
    - name: relay_03
      location: [16.0, 24.6, 10.0]
      look_at: [32.0, 24.6, 0.4]
      resolution: [1920, 1080]
      fov: 90.0
      use_depth: true
    - name: relay_04
      location: [36.0, 24.6, 10.0]
      look_at: [48.0, 24.6, 0.4]
      resolution: [1920, 1080]
      fov: 90.0
      use_depth: true
    - name: relay_05
      location: [44.0, 16.6, 10.0]
      look_at: [28.0, 16.6, 0.4]
      resolution: [1920, 1080]
      fov: 90.0
      use_depth: true
    - name: relay_06
      location: [8.0, 16.6, 10.0]
      look_at: [-8.0, 16.6, 0.4]
      resolution: [1920, 1080]
      fov: 90.0
      use_depth: true
    - name: relay_07
      location: [-20.0, 16.6, 10.0]
      look_at: [-32.0, 16.6, 0.4]
      resolution: [1920, 1080]
      fov: 90.0
      use_depth: true

# -----------------------------------------------------------------------------
# Scene dressing — same palette as L1 plus a *small* per-relay increment:
#   * 2-3 parked two-wheelers per relay (bike rack on near sidewalk)
#   * exactly ONE small extra prop per relay (mailbox / plantpot / colacan
#     / trafficcone / streetsign) — < 0.5 m, doesn't dominate the frame
#   * trees only on relays 02 / 04 / 05 / 06; 01 / 03 / 07 are tree-free
#     so the bike rack stays visible from the relay viewpoint
# Static-car palette and counts are inherited verbatim from L1.
# -----------------------------------------------------------------------------
scene:
  dressing:
    moving_npc_vehicles: 14
    npc_keepout_radius_m: 18.0
    npc_route_keepout_radius_m: 12.0
    npc_vehicle_filters:
      - vehicle.audi.*
      - vehicle.tesla.*
      - vehicle.mercedes.*
      - vehicle.nissan.*
      - vehicle.toyota.*
      - vehicle.mini.*
      - vehicle.bmw.*
      - vehicle.chevrolet.*
      - vehicle.dodge.*
      - vehicle.ford.*
      - vehicle.jeep.*
      - vehicle.lincoln.*
      - vehicle.seat.*
      - vehicle.volkswagen.*
      - vehicle.citroen.*
    walkers: 25
    walker_route_keepout_radius_m: 10.0
    walker_target_keepout_radius_m: 10.0

    # -----------------------------------------------------------------------
    # Geometry note:
    #   ring_radius_m  — distance from look_at to the FAR-sidewalk (median)
    #                    where static cars and static.prop.* sit (matches L1).
    #   bike_offset_m  — distance from look_at TOWARD the relay pole where
    #                    two-wheelers sit on the NEAR sidewalk. 4.5 m leaves
    #                    a 0.5 m margin against the UGV's stop_radius_m=4.0.
    # -----------------------------------------------------------------------
    per_relay:
      relay_01:
        ring_radius_m: 5.0
        bike_offset_m: 4.5
        static_vehicles: 3
        static_vehicle_blueprints:
          - vehicle.toyota.prius
          - vehicle.audi.a2
          - vehicle.mini.cooper_s
        props:
          # L1 baseline (no tree on this relay so foreground stays clean)
          - {blueprint: static.prop.kiosk_01, count: 1}
          - {blueprint: static.prop.trashcan02, count: 2}
          - {blueprint: static.prop.streetbarrier, count: 1}
          - {blueprint: static.prop.bench01, count: 1}
          # L2 increment: small extra prop
          - {blueprint: static.prop.mailbox, count: 1}
          # L2 increment: bike rack — 3 bicycles
          - {blueprint: vehicle.diamondback.century, count: 1}
          - {blueprint: vehicle.gazelle.omafiets, count: 2}

      relay_02:
        ring_radius_m: 5.0
        bike_offset_m: 4.5
        static_vehicles: 3
        static_vehicle_blueprints:
          - vehicle.audi.tt
          - vehicle.mercedes.coupe
          - vehicle.nissan.micra
          - vehicle.mini.cooper_s
        props:
          # L1 baseline (keep cypresstree as backdrop)
          - {blueprint: static.prop.advertisement, count: 1}
          - {blueprint: static.prop.trashcan04, count: 2}
          - {blueprint: static.prop.bench01, count: 1}
          - {blueprint: static.prop.cypresstree, count: 1}
          # L2 increment: small extra prop
          - {blueprint: static.prop.streetsign01, count: 1}
          # L2 increment: mixed two-wheeler rack — bike + scooter + moto
          - {blueprint: vehicle.gazelle.omafiets, count: 1}
          - {blueprint: vehicle.vespa.zx125, count: 1}
          - {blueprint: vehicle.kawasaki.ninja, count: 1}

      relay_03:
        ring_radius_m: 5.0
        bike_offset_m: 4.5
        static_vehicles: 3
        static_vehicle_blueprints:
          - vehicle.chevrolet.impala
          - vehicle.citroen.c3
          - vehicle.bmw.grandtourer
        props:
          # L1 baseline minus the tree (drops aporosatree to keep view clear)
          - {blueprint: static.prop.bench02, count: 1}
          - {blueprint: static.prop.trashcan03, count: 2}
          - {blueprint: static.prop.advertisement, count: 1}
          - {blueprint: static.prop.streetbarrier, count: 1}
          # L2 increment: small extra prop
          - {blueprint: static.prop.colacan, count: 1}
          # L2 increment: bike rack — 2 bicycles + scooter
          - {blueprint: vehicle.diamondback.century, count: 2}
          - {blueprint: vehicle.vespa.zx125, count: 1}

      relay_04:
        ring_radius_m: 5.0
        bike_offset_m: 4.5
        static_vehicles: 3
        static_vehicle_blueprints:
          - vehicle.tesla.model3
          - vehicle.audi.tt
          - vehicle.nissan.patrol
        props:
          # L1 baseline (keep cypresstree as backdrop)
          - {blueprint: static.prop.bench01, count: 1}
          - {blueprint: static.prop.trashcan01, count: 2}
          - {blueprint: static.prop.advertisement, count: 1}
          - {blueprint: static.prop.cypresstree, count: 1}
          # L2 increment: small extra prop
          - {blueprint: static.prop.plantpot01, count: 1}
          # L2 increment: bike rack — 3 bicycles
          - {blueprint: vehicle.bh.crossbike, count: 1}
          - {blueprint: vehicle.diamondback.century, count: 1}
          - {blueprint: vehicle.gazelle.omafiets, count: 1}

      relay_05:
        ring_radius_m: 5.0
        bike_offset_m: 4.5
        static_vehicles: 3
        static_vehicle_blueprints:
          - vehicle.seat.leon
          - vehicle.dodge.charger_police
          - vehicle.lincoln.mkz_2017
        props:
          # L1 baseline + a tree (cypresstree backdrop, only relay with 1 tree
          # added in L2 — relay_05's L1 had no tree; we add one for parity)
          - {blueprint: static.prop.trashcan05, count: 2}
          - {blueprint: static.prop.kiosk_01, count: 1}
          - {blueprint: static.prop.advertisement, count: 1}
          - {blueprint: static.prop.bench02, count: 1}
          - {blueprint: static.prop.cypresstree, count: 1}
          # L2 increment: small extra prop
          - {blueprint: static.prop.plantpot02, count: 1}
          # L2 increment: bike rack — 2 scooters + bicycle
          - {blueprint: vehicle.vespa.zx125, count: 2}
          - {blueprint: vehicle.gazelle.omafiets, count: 1}

      relay_06:
        ring_radius_m: 5.0
        bike_offset_m: 4.5
        static_vehicles: 2
        static_vehicle_blueprints:
          - vehicle.jeep.wrangler_rubicon
          - vehicle.ford.mustang
        props:
          # L1 baseline (keep cypresstree backdrop)
          - {blueprint: static.prop.streetbarrier, count: 2}
          - {blueprint: static.prop.trashcan01, count: 1}
          - {blueprint: static.prop.advertisement, count: 1}
          - {blueprint: static.prop.bench01, count: 1}
          - {blueprint: static.prop.cypresstree, count: 1}
          # L2 increment: small extra prop
          - {blueprint: static.prop.mailbox, count: 1}
          # L2 increment: bike rack — 2 bicycles
          - {blueprint: vehicle.gazelle.omafiets, count: 1}
          - {blueprint: vehicle.diamondback.century, count: 1}

      relay_07:
        ring_radius_m: 5.0
        bike_offset_m: 4.5
        static_vehicles: 2
        static_vehicle_blueprints:
          - vehicle.volkswagen.t2
          - vehicle.mini.cooper_s
        props:
          # L1 baseline minus the tree (drops aporosatree to keep view clear)
          - {blueprint: static.prop.streetbarrier, count: 2}
          - {blueprint: static.prop.trashcan04, count: 1}
          - {blueprint: static.prop.kiosk_01, count: 1}
          # L2 increment: small extra prop
          - {blueprint: static.prop.trafficcone01, count: 1}
          # L2 increment: bike rack — 2 bicycles
          - {blueprint: vehicle.gazelle.omafiets, count: 1}
          - {blueprint: vehicle.bh.crossbike, count: 1}

      default:
        static_vehicles: 0
        props: []

save:
  image_format: png
  save_depth_npy: false
  save_depth_png: false
  depth_png_max_m: 80.0
  save_frames_jsonl: true
  save_pose_csv: true
  save_calibration: true
  save_trajectory_yaml: true
  jsonl_filename: frames.jsonl
