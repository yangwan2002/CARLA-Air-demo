%YAML:1.0

# Camera calibration and distortion parameters (OpenCV)
# CARLA Town10HD UGV front camera
# Resolution: 1920x1080, FOV: 90 deg, zero distortion (CARLA pinhole model)

Camera.fx: 480.0
Camera.fy: 480.0
Camera.cx: 480.0
Camera.cy: 270.0

Camera.k1: 0.0
Camera.k2: 0.0
Camera.p1: 0.0
Camera.p2: 0.0
Camera.k3: 0.0

Camera.width: 960
Camera.height: 540

# Camera frames per second
Camera.fps: 10

# IR projector baseline times fx (bf = baseline_m * fx; fake value for RGBD)
Camera.bf: 20.0

# Color order of the images (0: BGR, 1: RGB)
Camera.RGB: 1

# Depth map values factor:
#   depth_m = pixel_value / DepthMapFactor
#   CARLA encoding: pixel = depth_m / max_depth_m * 65535, max_depth_m = 80.0
#   => DepthMapFactor = 65535 / 80 = 819.1875
Camera.DepthMapFactor: 819.1875

# Close/far threshold in meters (bf * ThDepth / fx = 20 * 40 / 480 = 1.67 m)
# Points closer than this use RGBD depth directly; farther need triangulation.
ThDepth: 40.0

# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 1000

# ORB Extractor: Scale factor between levels in the scale pyramid
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid
ORBextractor.nLevels: 8

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a
# minimum response. Firstly we impose iniThFAST. If no corners are detected
# we impose a lower value minThFAST. You can lower these values if your
# images have low contrast
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

# Viewer Parameters
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3
Viewer.ViewpointX: 0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500
